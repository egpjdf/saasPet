name: Secrets Rotation

on:
  schedule:
    # Run on 1st of every month at 2 AM UTC
    - cron: '0 2 1 * *'
  workflow_dispatch:
    inputs:
      force:
        description: 'Force rotation even if recently rotated'
        required: false
        type: boolean
        default: false

env:
  VAULT_ADDR: ${{ secrets.VAULT_ADDR }}
  VAULT_ROLE_ID: ${{ secrets.VAULT_ROLE_ID }}
  VAULT_SECRET_ID: ${{ secrets.VAULT_SECRET_ID }}

jobs:
  rotate-secrets:
    name: Rotate Secrets
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Install Vault CLI
        run: |
          wget -O- https://apt.releases.hashicorp.com/gpg | sudo gpg --dearmor -o /usr/share/keyrings/hashicorp-archive-keyring.gpg
          echo "deb [signed-by=/usr/share/keyrings/hashicorp-archive-keyring.gpg] https://apt.releases.hashicorp.com $(lsb_release -cs) main" | sudo tee /etc/apt/sources.list.d/hashicorp.list
          sudo apt update && sudo apt install -y vault

      - name: Install 1Password CLI
        run: |
          curl -sS https://downloads.1password.com/linux/keys/1password.asc | sudo gpg --dearmor --output /usr/share/keyrings/1password-archive-keyring.gpg
          echo "deb [arch=$(dpkg --print-architecture) signed-by=/usr/share/keyrings/1password-archive-keyring.gpg] https://downloads.1password.com/linux/debian $(lsb_release -cs) stable" | sudo tee /etc/apt/sources.list.d/1password.list
          sudo apt update && sudo apt install -y 1password-cli

      - name: Configure 1Password
        run: |
          echo "${{ secrets.OP_SERVICE_ACCOUNT_TOKEN }}" | op signin

      - name: Run rotation script
        run: |
          chmod +x scripts/rotate-secrets.sh
          ./scripts/rotate-secrets.sh
        env:
          SLACK_WEBHOOK_URL: ${{ secrets.SLACK_WEBHOOK_URL }}
          EMAIL_WEBHOOK_URL: ${{ secrets.EMAIL_WEBHOOK_URL }}

      - name: Notify on failure
        if: failure()
        run: |
          curl -X POST "${{ secrets.SLACK_WEBHOOK_URL }}" \
            -H "Content-Type: application/json" \
            -d '{"text": "🚨 Secrets rotation FAILED for Saaspet", "attachments": [{"color": "danger", "fields": [{"title": "Workflow", "value": "secrets-rotation", "short": true}, {"title": "Run", "value": "'${{ github.run_id }}'", "short": true}]}]}'

  validate-secrets:
    name: Validate Secrets Access
    runs-on: ubuntu-latest
    needs: rotate-secrets
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Install Vault CLI
        run: |
          wget -O- https://apt.releases.hashicorp.com/gpg | sudo gpg --dearmor -o /usr/share/keyrings/hashicorp-archive-keyring.gpg
          echo "deb [signed-by=/usr/share/keyrings/hashicorp-archive-keyring.gpg] https://apt.releases.hashicorp.com $(lsb_release -cs) main" | sudo tee /etc/apt/sources.list.d/hashicorp.list
          sudo apt update && sudo apt install -y vault

      - name: Validate Vault access
        run: |
          export VAULT_TOKEN=$(vault write -field=token auth/approle/login \
            role_id="${{ secrets.VAULT_ROLE_ID }}" \
            secret_id="${{ secrets.VAULT_SECRET_ID }}")
          
          # Check each secret exists and has recent rotation timestamp
          for secret in database redis jwt encryption stripe paddle resend sentry; do
            echo "Checking secret/saaspet/$secret..."
            vault kv get -format=json secret/saaspet/$secret | jq -r '.data.data.rotated_at'
          done

      - name: Validate 1Password access
        run: |
          echo "${{ secrets.OP_SERVICE_ACCOUNT_TOKEN }}" | op signin
          
          # Check 1Password items exist
          op item get "Database Credentials" --vault="Saaspet" --format=json | jq -r '.updated_at'
          op item get "Redis Credentials" --vault="Saaspet" --format=json | jq -r '.updated_at'
          op item get "JWT Secret" --vault="Saaspet" --format=json | jq -r '.updated_at'

  notify:
    name: Notify Completion
    runs-on: ubuntu-latest
    needs: [rotate-secrets, validate-secrets]
    if: always()
    steps:
      - name: Notify success
        if: success()
        run: |
          curl -X POST "${{ secrets.SLACK_WEBHOOK_URL }}" \
            -H "Content-Type: application/json" \
            -d '{"text": "✅ Monthly secrets rotation completed and validated"}'

      - name: Notify failure
        if: failure()
        run: |
          curl -X POST "${{ secrets.SLACK_WEBHOOK_URL }}" \
            -H "Content-Type: application/json" \
            -d '{"text": "🚨 Monthly secrets rotation FAILED", "attachments": [{"color": "danger", "fields": [{"title": "Rotation", "value": "${{ needs.rotate-secrets.result }}", "short": true}, {"title": "Validation", "value": "${{ needs.validate-secrets.result }}", "short": true}]}]}'